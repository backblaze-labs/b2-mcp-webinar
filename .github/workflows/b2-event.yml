name: B2 event received

# Triggered by the relay (relay/relay.js or api/relay.js) via GitHub's `repository_dispatch`
# API — the only inbound trigger surface GitHub Actions exposes to a system outside GitHub.
# The relay also posts directly to Discord; this workflow is the GitHub-side reaction.
on:
  repository_dispatch:
    types: [b2_object_created]

permissions:
  issues: write

jobs:
  open-issue:
    name: Open an issue for the upload
    runs-on: ubuntu-latest
    steps:
      - name: Create issue from the relayed B2 event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUCKET: ${{ github.event.client_payload.bucketName }}
          OBJECT: ${{ github.event.client_payload.objectName }}
          EVENT_TYPE: ${{ github.event.client_payload.eventType }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "New object: ${OBJECT} (${BUCKET})" \
            --body "**Event:** ${EVENT_TYPE}
          **Bucket:** ${BUCKET}
          **Object:** ${OBJECT}

          Opened automatically in response to a B2 event notification relayed through [relay/relay.js](../blob/main/relay/relay.js) (Cloudflare Worker) or [api/relay.js](../blob/main/api/relay.js) (Vercel Edge Function). The same relay call also posted this event to Discord."
